<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | Jalaya_Jo</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>

        <div class="logo">
            <img src="img/logo/Jalaya_Jo_logo.png" alt="Logo de Jalaya_Jo">
            Jalaya_Jo
        </div>

        <!-- MENÚ -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="#">Contacto</a>
        </nav>

        <!-- CARRITO -->
        <div class="carrito">
            🛒
            <span id="cantidad-carrito">0</span>
        </div>

    </header>

<!-- ========================================
     VENTANA DE ZOOM
========================================= -->

<div id="modal-imagen" class="modal-imagen">

    <!-- Botón para cerrar -->
    <button 
        class="cerrar-modal" 
        onclick="cerrarZoom()">
        ✕
    </button>

    <!-- Botón imagen anterior -->
    <button 
        class="flecha flecha-izquierda" 
        onclick="imagenAnterior()">
        ‹
    </button>

    <!-- Imagen ampliada -->
    <img 
        id="imagen-zoom" 
        src="" 
        alt="Imagen ampliada">

    <!-- Botón imagen siguiente -->
    <button 
        class="flecha flecha-derecha" 
        onclick="imagenSiguiente()">
        ›
    </button>

</div>
    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section class="productos">

            <h1>Todos nuestros productos</h1>

            <p>
                Descubrí nuestra colección de accesorios artesanales.
            </p>

            <!-- Acá JavaScript va a colocar los productos -->
            <div id="productos-container">
            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <p>Jalaya_Jo</p>
        <p>Accesorios artesanales</p>

    </footer>


    <!-- Primero cargamos los productos -->
    <script src="js/productos.js"></script>

    <!-- Después cargamos la lógica -->
    <script src="js/app.js"></script>

</body>

</html>
